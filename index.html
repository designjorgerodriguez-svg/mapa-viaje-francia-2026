const map=L.map('map',{zoomControl:true});
const outdoors=L.tileLayer('https://tiles.stadiamaps.com/tiles/outdoors/{z}/{x}/{y}{r}.png',{maxZoom:20,attribution:'&copy; Stadia Maps &copy; OpenMapTiles &copy; OpenStreetMap contributors'}).addTo(map);
const osm=L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:19,attribution:'&copy; OpenStreetMap contributors'});
const terrain=L.tileLayer('https://{s}.tile.opentopomap.org/{z}/{x}/{y}.png',{maxZoom:17,attribution:'&copy; OpenStreetMap contributors · SRTM · OpenTopoMap'});
L.control.layers({'Stadia Outdoors':outdoors,'OpenStreetMap':osm,'Relieve':terrain},null,{collapsed:true}).addTo(map);
const markers=new Map(),bounds=L.latLngBounds([]);
function svgFor(c){return svgs[c]||svgs.Visita}
function iconHtml(c,cls='cat-icon'){return `<span class="${cls}" style="--cat:${colors[c]||'#4f8fcd'}">${svgFor(c)}</span>`}
function icon(p){return L.divIcon({className:'',html:`<div style="width:35px;height:35px;border-radius:12px;display:grid;place-items:center;background:${colors[p.category]||'#4f8fcd'};color:#fff;border:1.5px solid rgba(255,255,255,.9);box-shadow:0 5px 14px rgba(0,0,0,.3),inset 0 0 0 1px rgba(255,255,255,.12)">${svgFor(p.category).replace('<svg ','<svg style="width:19px;height:19px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round" ')}</div>`,iconSize:[35,35],iconAnchor:[17.5,17.5],popupAnchor:[0,-18]})}
function gmaps(p){return `https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(p.name)}`}
function popupBadgeClass(text,type){return text.includes('No confirmado')||text.includes('⚠️')?'popup-badge warn':`popup-badge ${type}`}
function popup(p){return `<div class="popup"><h3>${iconHtml(p.category)}${p.name}</h3><div class="category">${p.category}</div><p class="desc">${p.desc}</p><div class="popup-badges"><div class="${popupBadgeClass(p.access,'access')}"><b>Entrada / precio:</b> ${p.access}</div><div class="${popupBadgeClass(p.dogs,'dog')}"><b>Perros:</b> ${p.dogs}</div></div><div class="popup-facts"><div><b>Qué merece la pena:</b> ${p.highlights}</div><div><b>Tiempo recomendado:</b> ${p.time}</div></div><div class="popup-tip"><b>Consejo:</b> ${p.tip}</div><a href="${gmaps(p)}" target="_blank" rel="noopener">Google Maps</a><a class="secondary" href="${p.source}" target="_blank" rel="noopener">Fuente</a></div>`}
places.forEach(p=>{const m=L.marker([p.lat,p.lng],{icon:icon(p)}).bindPopup(popup(p),{maxWidth:360}).addTo(map);markers.set(p.id,m);bounds.extend([p.lat,p.lng])});
map.fitBounds(bounds,{padding:[30,30]});
const list=document.getElementById('list'),status=document.getElementById('status');
document.getElementById('subtitle').textContent=`${places.length} lugares guardados · mapa interactivo`;
const cats=[...new Set(places.map(p=>p.category))];
let selected=new Set(),draftSelected=new Set();
function visible(p){return selected.size===0||selected.has(p.category)}
function badgeClass(t,type){return t.includes('No confirmado')||t.includes('⚠️')?'badge warn':`badge ${type}`}
function compactAccess(t){const price=t.match(/\d+(?:[,.]\d+)?\s*€/);if(/gratis|gratuit|acceso libre/i.test(t))return price?`Gratis / ${price[0]}`:'Gratis';if(price)return price[0];if(/de pago|pago/i.test(t))return'De pago';return'Consultar'}
function compactDogs(t){if(/prohib/i.test(t))return'No';if(/⚠️|no confirmado|consultar|no he encontrado|no especifica|preguntar/i.test(t))return'Consultar';if(/sí|admitid|bienvenid|aceptad/i.test(t))return'Sí';return'Consultar'}
function closeOtherCards(current){document.querySelectorAll('.place.open').forEach(card=>{if(card!==current){card.classList.remove('open');const b=card.querySelector('.place-summary');if(b)b.setAttribute('aria-expanded','false')}})}
function renderPlaces(){
 list.innerHTML='';
 places.filter(visible).forEach(p=>{
   const el=document.createElement('article');el.className='place';const dogShort=compactDogs(p.dogs),accessShort=compactAccess(p.access);
   el.innerHTML=`<button class="place-summary" type="button" aria-expanded="false">${iconHtml(p.category)}<span class="summary-copy"><span class="summary-title">${p.name}</span><span class="summary-meta">${p.category} · ${p.time}</span></span><span class="summary-side"><span class="quick-badges"><span class="quick">${accessShort}</span><span class="quick ${dogShort==='Consultar'?'warn':'dog'}">Perro: ${dogShort}</span></span><span class="card-chevron"><svg viewBox="0 0 24 24"><path d="m6 9 6 6 6-6"/></svg></span></span></button><div class="place-body"><p class="desc">${p.desc}</p><div class="badges"><span class="${badgeClass(p.access,'access')}"><b>Entrada:</b> ${p.access}</span><span class="${badgeClass(p.dogs,'dog')}"><b>Perros:</b> ${p.dogs}</span></div><div class="facts"><div><b>Qué merece la pena:</b> ${p.highlights}</div><div><b>Tiempo recomendado:</b> ${p.time}</div><div><b>Consejo:</b> ${p.tip}</div></div><div class="links"><button class="map-jump" type="button">Ver en el mapa</button><a href="${gmaps(p)}" target="_blank" rel="noopener">Google Maps</a><a class="secondary" href="${p.source}" target="_blank" rel="noopener">Fuente</a></div></div>`;
   const summary=el.querySelector('.place-summary');summary.addEventListener('click',()=>{const opening=!el.classList.contains('open');if(opening)closeOtherCards(el);el.classList.toggle('open',opening);summary.setAttribute('aria-expanded',String(opening));if(opening)setTimeout(()=>el.scrollIntoView({block:'nearest',behavior:'smooth'}),80)});
   el.querySelector('.map-jump').addEventListener('click',()=>{map.closePopup();const goToPoint=()=>{map.invalidateSize();map.setView([p.lat,p.lng],14,{animate:true})};if(mobile()){setSheet('collapsed');setTimeout(goToPoint,320)}else goToPoint()});
   list.appendChild(el);
 });
 markers.forEach((m,id)=>{const p=places.find(x=>x.id===id);visible(p)?(!map.hasLayer(m)&&m.addTo(map)):map.removeLayer(m)});
 updateFilterFab();
}
const filterFab=document.getElementById('filterFab'),filterState=document.getElementById('filterState'),filterOverlay=document.getElementById('filterOverlay'),filterMenu=document.getElementById('filterMenu'),filterSummary=document.getElementById('filterSummary');
function updateFilterFab(){const n=selected.size;filterState.textContent=n===0?'Todos':`${n} activos`;filterFab.classList.toggle('has-filters',n>0)}
function renderFilterMenu(){
 filterMenu.innerHTML='';
 cats.forEach(c=>{const count=places.filter(p=>p.category===c).length;const b=document.createElement('button');b.type='button';b.className='filter-option'+(draftSelected.has(c)?' selected':'');b.innerHTML=`${iconHtml(c,'filter-icon')}<span class="filter-option-copy"><span class="filter-option-name">${c}</span><span class="filter-option-count">${count} ${count===1?'lugar':'lugares'}</span></span><span class="filter-check"><svg viewBox="0 0 24 24"><path d="m5 12 4 4 10-10"/></svg></span>`;b.addEventListener('click',()=>{draftSelected.has(c)?draftSelected.delete(c):draftSelected.add(c);renderFilterMenu()});filterMenu.appendChild(b)});
 const visibleCount=draftSelected.size===0?places.length:places.filter(p=>draftSelected.has(p.category)).length;filterSummary.textContent=draftSelected.size===0?`Mostrando todos los lugares (${places.length}).`:`${draftSelected.size} tipos seleccionados · ${visibleCount} lugares visibles.`;
}
function openFilters(){draftSelected=new Set(selected);renderFilterMenu();filterOverlay.classList.add('open');filterFab.setAttribute('aria-expanded','true')}
function closeFilters(){filterOverlay.classList.remove('open');filterFab.setAttribute('aria-expanded','false')}
filterFab.addEventListener('click',openFilters);document.getElementById('filterClose').addEventListener('click',closeFilters);filterOverlay.addEventListener('click',e=>{if(e.target===filterOverlay)closeFilters()});
document.getElementById('filterClear').addEventListener('click',()=>{draftSelected.clear();renderFilterMenu()});
document.getElementById('filterApply').addEventListener('click',()=>{selected=new Set(draftSelected);renderPlaces();closeFilters()});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&filterOverlay.classList.contains('open'))closeFilters()});
renderPlaces();
document.getElementById('fit').onclick=()=>{const v=places.filter(visible);if(v.length)map.fitBounds(L.latLngBounds(v.map(p=>[p.lat,p.lng])),{padding:[30,30]})};
let userMarker,userAccuracy;
function locateMe(){if(!navigator.geolocation){status.textContent='Este navegador no permite geolocalización.';return}status.textContent='Buscando tu ubicación…';navigator.geolocation.getCurrentPosition(pos=>{const {latitude,longitude,accuracy}=pos.coords;if(userMarker)map.removeLayer(userMarker);if(userAccuracy)map.removeLayer(userAccuracy);userAccuracy=L.circle([latitude,longitude],{radius:accuracy,color:'#328cf0',weight:1,fillOpacity:.08}).addTo(map);userMarker=L.marker([latitude,longitude],{icon:L.divIcon({className:'',html:'<div class="gps-dot"></div>',iconSize:[16,16],iconAnchor:[8,8]})}).bindPopup(`Tu ubicación<br><small>Precisión aprox.: ${Math.round(accuracy)} m</small>`).addTo(map);map.setView([latitude,longitude],15);userMarker.openPopup();status.textContent=`Ubicación encontrada · precisión aprox. ${Math.round(accuracy)} m`},err=>{status.textContent=err.code===1?'Permiso de ubicación denegado.':'No se ha podido obtener tu ubicación.'},{enableHighAccuracy:true,timeout:12000,maximumAge:30000})}
document.getElementById('locate').onclick=locateMe;
const sheet=document.getElementById('sheet'),handle=document.getElementById('sheetHandle'),up=document.getElementById('sheetUp'),down=document.getElementById('sheetDown');let sheetState='half';
function mobile(){return matchMedia('(max-width:760px)').matches}function sizes(){const h=window.innerHeight;return{collapsed:60,half:Math.round(h*.54),full:Math.max(260,h-5)}}
function setSheet(state,customHeight=null){if(!mobile())return;sheetState=state;sheet.classList.remove('collapsed','expanded');if(state==='collapsed')sheet.classList.add('collapsed');if(state==='full')sheet.classList.add('expanded');if(customHeight!==null)sheet.style.height=customHeight+'px';else sheet.style.height='';down.disabled=state==='collapsed';up.disabled=state==='full';setTimeout(()=>map.invalidateSize(),300)}
up.onclick=e=>{e.stopPropagation();setSheet(sheetState==='collapsed'?'half':'full')};down.onclick=e=>{e.stopPropagation();setSheet(sheetState==='full'?'half':'collapsed')};
let dragging=false,startY=0,startH=0;handle.addEventListener('pointerdown',e=>{if(!mobile()||e.target.closest('button'))return;dragging=true;startY=e.clientY;startH=sheet.getBoundingClientRect().height;sheet.classList.add('dragging');handle.setPointerCapture(e.pointerId)});handle.addEventListener('pointermove',e=>{if(!dragging)return;const s=sizes();const h=Math.max(s.collapsed,Math.min(s.full,startH+(startY-e.clientY)));sheet.style.height=h+'px';map.invalidateSize()});function endDrag(e){if(!dragging)return;dragging=false;sheet.classList.remove('dragging');try{handle.releasePointerCapture(e.pointerId)}catch{}const h=sheet.getBoundingClientRect().height,s=sizes(),points=[['collapsed',s.collapsed],['half',s.half],['full',s.full]];points.sort((a,b)=>Math.abs(a[1]-h)-Math.abs(b[1]-h));setSheet(points[0][0])}handle.addEventListener('pointerup',endDrag);handle.addEventListener('pointercancel',endDrag);window.addEventListener('resize',()=>{if(mobile())setSheet(sheetState);else{sheet.style.height='';sheet.classList.remove('collapsed','expanded')}});if(mobile())setSheet('half');
let deferredPrompt=null;const installBtn=document.getElementById('installApp');window.addEventListener('beforeinstallprompt',e=>{e.preventDefault();deferredPrompt=e;installBtn.style.display='inline-flex'});installBtn.onclick=async()=>{if(deferredPrompt){deferredPrompt.prompt();await deferredPrompt.userChoice;deferredPrompt=null;return}const isiOS=/iphone|ipad|ipod/i.test(navigator.userAgent);status.textContent=isiOS?'En iPhone: Compartir → Añadir a pantalla de inicio.':'En Chrome: menú ⋮ → Añadir a pantalla de inicio / Instalar app.'};window.addEventListener('appinstalled',()=>{status.textContent='Mapa instalado en el móvil.'});if('serviceWorker'in navigator){window.addEventListener('load',()=>navigator.serviceWorker.register('./sw.js').catch(()=>{}))}
</script>
</body>
</html>
