<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8"/><meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>Viaje Francia 2026 · Mapa</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
<style>
:root{--bg:#0d1117;--panel:#161b22;--card:#21262d;--text:#f0f6fc;--muted:#8b949e;--line:#30363d;--accent:#2f81f7}
*{box-sizing:border-box}body{margin:0;font-family:Inter,system-ui,-apple-system,Segoe UI,Roboto,sans-serif;background:var(--bg);color:var(--text)}
.app{display:grid;grid-template-columns:440px 1fr;height:100vh}.sidebar{background:var(--panel);border-right:1px solid var(--line);overflow:auto;padding:22px}.map{height:100vh}
h1{font-size:24px;margin:0 0 6px}.sub{color:var(--muted);font-size:14px;margin-bottom:16px}.toolbar{display:flex;gap:8px;margin-bottom:16px}.tool{border:1px solid var(--line);background:var(--card);color:#fff;border-radius:10px;padding:9px 11px;cursor:pointer;font-weight:600}.status{font-size:12px;color:var(--muted);margin:-7px 0 14px;min-height:16px}.filters{display:flex;flex-wrap:wrap;gap:7px;margin-bottom:16px}.filter{border:1px solid var(--line);background:var(--card);color:var(--text);border-radius:999px;padding:7px 10px;cursor:pointer;font-size:12px;display:inline-flex;align-items:center;gap:6px}.filter.active{background:var(--accent);border-color:var(--accent)}
.list{display:flex;flex-direction:column;gap:12px}.place{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;cursor:pointer;transition:.15s}.place:hover{border-color:#6e7681;transform:translateY(-1px)}.place h2{font-size:16px;margin:0 0 7px;display:flex;align-items:center;gap:8px}.meta{font-size:12px;color:var(--muted);margin-bottom:8px}.desc{font-size:13px;line-height:1.5;color:#c9d1d9;margin:0}.facts{margin-top:10px;padding-top:10px;border-top:1px solid var(--line);display:grid;gap:7px;font-size:12px;line-height:1.45;color:#c9d1d9}.facts b{color:var(--text)}.badges{display:flex;gap:7px;flex-wrap:wrap;margin-top:10px}.badge{padding:5px 8px;border-radius:999px;font-size:11px;font-weight:700;background:#30363d}.badge.access{background:#243447}.badge.dog{background:#1f3d2b}.badge.warn{background:#4d3610}.links{display:flex;gap:7px;flex-wrap:wrap;margin-top:11px}.links a{font-size:12px;text-decoration:none;color:#fff;background:#2f81f7;padding:7px 9px;border-radius:8px}.links a.secondary{background:#30363d}
.cat-icon,.filter-icon{display:inline-grid;place-items:center;border-radius:50%;flex:0 0 auto}.cat-icon{width:28px;height:28px}.filter-icon{width:16px;height:16px}.cat-icon svg{width:15px;height:15px}.filter-icon svg{width:10px;height:10px}.leaflet-popup-content-wrapper,.leaflet-popup-tip{background:#161b22;color:#f0f6fc}.popup{max-width:310px}.popup h3{margin:0 0 6px;font-size:16px;display:flex;align-items:center;gap:8px}.popup p{margin:0 0 7px;line-height:1.4}.popup .mini{font-size:12px;color:#c9d1d9}.popup a{display:inline-block;color:#fff;background:#2f81f7;text-decoration:none;border-radius:8px;padding:7px 9px;font-weight:600;margin:3px 4px 0 0}.legend{margin-top:18px;padding-top:16px;border-top:1px solid var(--line);font-size:12px;color:var(--muted);line-height:1.45}.gps-dot{width:16px;height:16px;border-radius:50%;background:#1685ff;border:3px solid white;box-shadow:0 0 0 5px rgba(22,133,255,.25)}
@media(max-width:760px){.app{grid-template-columns:1fr;grid-template-rows:46vh 54vh}.sidebar{grid-row:2;padding:15px;border-right:0;border-top:1px solid var(--line)}.map{height:46vh;grid-row:1}h1{font-size:20px}.toolbar{position:sticky;top:-15px;background:var(--panel);padding:8px 0;z-index:5}}
</style>
</head>
<body><div class="app"><aside class="sidebar"><h1>Viaje Francia 2026</h1><div class="sub" id="subtitle"></div><div class="toolbar"><button class="tool" id="locate">📍 Mi ubicación</button><button class="tool" id="fit">Ver visibles</button></div><div class="status" id="status"></div><div class="filters" id="filters"></div><div class="list" id="list"></div><div class="legend">Puedes combinar varios tipos a la vez. “Todos” restablece el mapa completo. Las playas y baños interiores con perro incluyen la norma concreta de acceso; en verano conviene comprobar también la señalización local.</div></aside><div id="map" class="map"></div></div>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script><script src="places.js"></script><script src="beaches.js"></script><script src="inland.js"></script>
<script>
const places=[...(window.PLACES||[]),...(window.BEACHES||[]),...(window.INLAND||[])];
const colors={Visita:'#2f81f7','Pueblo / costa':'#58a6ff',Pueblo:'#d29922',Actividad:'#db61a2',Naturaleza:'#3fb950',Artesanía:'#a371f7',Gastronomía:'#f0883e',Pernocta:'#1f6feb',Parking:'#8b949e','Playa con perro':'#0ea5a8','Baño interior':'#14b8a6'};
const svgs={Visita:'<svg viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2"><path d="M4 20h16M6 20V8l6-4 6 4v12M9 20v-6h6v6"/></svg>','Pueblo / costa':'<svg viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2"><path d="M3 10c2 0 2-2 4-2s2 2 4 2 2-2 4-2 2 2 4 2M3 15c2 0 2-2 4-2s2 2 4 2 2-2 4-2 2 2 4 2"/></svg>',Pueblo:'<svg viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2"><path d="M4 11.5 12 5l8 6.5V20H4zM10 20v-5h4v5"/></svg>',Actividad:'<svg viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2"><path d="M6 20V4M6 5h10l-2 3 2 3H6"/></svg>',Naturaleza:'<svg viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2"><path d="M3 19 10 8l4 6 2-3 5 8H3z"/></svg>',Artesanía:'<svg viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2"><path d="M8 4h8M10 4v4l-3 4a5 5 0 0 0 10 0l-3-4V4"/></svg>',Gastronomía:'<svg viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2"><path d="M8 4h8v4a4 4 0 0 1-8 0V4zM12 12v6M9 20h6"/></svg>',Pernocta:'<svg viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2"><path d="M19 13a7 7 0 1 1-8-8 5.5 5.5 0 0 0 8 8z"/></svg>',Parking:'<svg viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2"><path d="M8 20V4h6a4 4 0 0 1 0 8H8"/></svg>','Playa con perro':'<svg viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2" stroke-linecap="round"><path d="M4 15c2 0 2-2 4-2s2 2 4 2 2-2 4-2 2 2 4 2M5 8l2-2 2 2M15 8l2-2 2 2"/></svg>','Baño interior':'<svg viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2" stroke-linecap="round"><path d="M3 16c2 0 2-2 4-2s2 2 4 2 2-2 4-2 2 2 4 2M5 10h14M7 10l3-5 4 5"/></svg>'};
const map=L.map('map',{zoomControl:true});const outdoors=L.tileLayer('https://tiles.stadiamaps.com/tiles/outdoors/{z}/{x}/{y}{r}.png',{maxZoom:20,attribution:'&copy; Stadia Maps &copy; OpenMapTiles &copy; OpenStreetMap contributors'}).addTo(map);const osm=L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:19,attribution:'&copy; OpenStreetMap contributors'});const terrain=L.tileLayer('https://{s}.tile.opentopomap.org/{z}/{x}/{y}.png',{maxZoom:17,attribution:'&copy; OpenStreetMap contributors · SRTM · OpenTopoMap'});L.control.layers({'Stadia Outdoors':outdoors,'OpenStreetMap':osm,'Relieve':terrain},null,{collapsed:true}).addTo(map);
const markers=new Map(),bounds=L.latLngBounds([]);function svgFor(c){return svgs[c]||svgs.Visita}function iconHtml(c,cls='cat-icon'){return `<span class="${cls}" style="background:${colors[c]||'#2f81f7'}">${svgFor(c)}</span>`}function icon(p){return L.divIcon({className:'',html:`<div style="width:32px;height:32px;border-radius:50%;display:grid;place-items:center;background:${colors[p.category]||'#2f81f7'};border:2px solid #fff;box-shadow:0 2px 8px #0008">${svgFor(p.category)}</div>`,iconSize:[32,32],iconAnchor:[16,16],popupAnchor:[0,-16]})}function gmaps(p){return `https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(p.name)}`}function popup(p){return `<div class="popup"><h3>${iconHtml(p.category)}${p.name}</h3><p><b>${p.category}</b></p><p>${p.desc}</p><p class="mini"><b>Entrada/precio:</b> ${p.access}</p><p class="mini"><b>🐾 Perro:</b> ${p.dogs}</p><p class="mini"><b>Tiempo:</b> ${p.time}</p><a href="${gmaps(p)}" target="_blank">Google Maps</a><a href="${p.source}" target="_blank">Fuente</a></div>`}places.forEach(p=>{const m=L.marker([p.lat,p.lng],{icon:icon(p)}).bindPopup(popup(p)).addTo(map);markers.set(p.id,m);bounds.extend([p.lat,p.lng])});map.fitBounds(bounds,{padding:[30,30]});
const filters=document.getElementById('filters'),list=document.getElementById('list'),status=document.getElementById('status');document.getElementById('subtitle').textContent=`Guía interactiva · ${places.length} lugares guardados`;const cats=[...new Set(places.map(p=>p.category))];let selected=new Set();function visible(p){return selected.size===0||selected.has(p.category)}function badgeClass(t,type){return t.includes('No confirmado')||t.includes('⚠️')?'badge warn':`badge ${type}`}function render(){filters.innerHTML='';const all=document.createElement('button');all.className='filter'+(selected.size===0?' active':'');all.textContent='Todos';all.onclick=()=>{selected.clear();render()};filters.appendChild(all);cats.forEach(c=>{const b=document.createElement('button');b.className='filter'+(selected.has(c)?' active':'');b.innerHTML=`${iconHtml(c,'filter-icon')}${c}`;b.onclick=()=>{selected.has(c)?selected.delete(c):selected.add(c);render()};filters.appendChild(b)});list.innerHTML='';places.filter(visible).forEach(p=>{const el=document.createElement('article');el.className='place';el.innerHTML=`<h2>${iconHtml(p.category)}${p.name}</h2><div class="meta">${p.category}</div><p class="desc">${p.desc}</p><div class="badges"><span class="${badgeClass(p.access,'access')}">🎟 ${p.access}</span><span class="${badgeClass(p.dogs,'dog')}">🐾 ${p.dogs}</span></div><div class="facts"><div><b>Qué merece la pena:</b> ${p.highlights}</div><div><b>Tiempo recomendado:</b> ${p.time}</div><div><b>Consejo:</b> ${p.tip}</div></div><div class="links"><a href="${gmaps(p)}" target="_blank">Abrir en Google Maps</a><a class="secondary" href="${p.source}" target="_blank">Fuente</a></div>`;el.onclick=e=>{if(e.target.tagName==='A')return;map.setView([p.lat,p.lng],14,{animate:true});markers.get(p.id).openPopup()};list.appendChild(el)});markers.forEach((m,id)=>{const p=places.find(x=>x.id===id);visible(p)?(!map.hasLayer(m)&&m.addTo(map)):map.removeLayer(m)})}render();
document.getElementById('fit').onclick=()=>{const v=places.filter(visible);if(v.length)map.fitBounds(L.latLngBounds(v.map(p=>[p.lat,p.lng])),{padding:[30,30]})};let userMarker,userAccuracy;document.getElementById('locate').onclick=()=>{if(!navigator.geolocation){status.textContent='Este navegador no permite geolocalización.';return}status.textContent='Buscando tu ubicación…';navigator.geolocation.getCurrentPosition(pos=>{const {latitude,longitude,accuracy}=pos.coords;if(userMarker)map.removeLayer(userMarker);if(userAccuracy)map.removeLayer(userAccuracy);userAccuracy=L.circle([latitude,longitude],{radius:accuracy,color:'#1685ff',weight:1,fillOpacity:.08}).addTo(map);userMarker=L.marker([latitude,longitude],{icon:L.divIcon({className:'',html:'<div class="gps-dot"></div>',iconSize:[16,16],iconAnchor:[8,8]})}).bindPopup(`Tu ubicación<br><small>Precisión aprox.: ${Math.round(accuracy)} m</small>`).addTo(map);map.setView([latitude,longitude],15);userMarker.openPopup();status.textContent=`Ubicación encontrada · precisión aprox. ${Math.round(accuracy)} m`},err=>{status.textContent=err.code===1?'Permiso de ubicación denegado.':'No se ha podido obtener tu ubicación.'},{enableHighAccuracy:true,timeout:12000,maximumAge:30000})};
</script></body></html>
